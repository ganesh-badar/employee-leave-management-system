# =====================================================================
# Database Configuration for Employee Leave Management System (ELMS)
# =====================================================================

# Primary Database Driver & Connection (MySQL 8.x)
db.type=mysql
db.mysql.driver=com.mysql.cj.jdbc.Driver
db.mysql.url=jdbc:mysql://localhost:3306/leave_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.username=root
db.mysql.password=root

# Fallback In-Memory / File Database (H2 Engine with MySQL dialect)
# Ensures zero-setup out of the box evaluation when MySQL service is offline
db.h2.driver=org.h2.Driver
db.h2.url=jdbc:h2:file:./data/leave_management_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
db.h2.username=sa
db.h2.password=

# Auto Fallback Behavior: if MySQL service is stopped, seamlessly boot local persistence
db.auto.fallback=true

# Connection Pool Settings (HikariCP)
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=300000
db.pool.connectionTimeout=4000
db.pool.maxLifetime=1800000

# Application Server Port & Context
server.port=8080
server.contextPath=/elms
