# =====================================================================
# Production Reverse Proxy Configuration for Custom Domain
# Domain: leave.internal.corp
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name leave.internal.corp hrms.local;

    # Client Request Payload Limit
    client_max_body_size 10M;

    # Static Asset Caching
    location /elms/static/ {
        proxy_pass http://127.0.0.1:8080/elms/static/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Main Application Proxy
    location / {
        proxy_pass http://127.0.0.1:8080/elms/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for real-time responsiveness
        proxy_buffering off;
    }
}
